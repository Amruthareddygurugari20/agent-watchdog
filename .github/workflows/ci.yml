name: CI

# Run the tests AND the benchmark on every push and pull request, so a change
# that quietly regresses the catch rate or trips a false alarm is visible.
on:
  push:
  pull_request:

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run the benchmark (rules_only vs hybrid)
        run: python evaluate.py

      - name: Run the adversarial stress test
        run: python stress_test.py

      - name: Upload decision log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-log-py${{ matrix.python-version }}
          path: eval_log.jsonl
          if-no-files-found: ignore
