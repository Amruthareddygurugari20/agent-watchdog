[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-watchdog"
version = "0.1.0"
description = "An open safety watchdog for AI coding agents: rules + AI + human, never AI alone."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "agent-watchdog contributors" }]
keywords = ["ai-safety", "agents", "guardrails", "llm", "security", "watchdog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# No required runtime dependencies — standard library only.
dependencies = []

[project.optional-dependencies]
# The transparent HeuristicJudge needs none of this; these enable the optional
# open-weights local-LLM judge only.
llm = ["transformers>=4.40", "torch>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
agent-watchdog = "agent_watchdog.__main__:main"

[project.urls]
Homepage = "https://github.com/OWNER/agent-watchdog"
Repository = "https://github.com/OWNER/agent-watchdog"
Issues = "https://github.com/OWNER/agent-watchdog/issues"

[tool.setuptools]
packages = ["agent_watchdog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
